[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realman_rl_simtoreal"
version = "0.1.0"
description = "MuJoCo simulation and offline kinematics experiments for RML63"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["realman_rl_simtoreal*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
vendor = {file = ["requirements-vendor.txt"]}
rl = {file = ["requirements-rl.txt"]}
